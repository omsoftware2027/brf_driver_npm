<div class="mt-3">
    <div class="row align-content-between">
        <div class="col-8 p-0">
            <b class="fw-bold fs-3">All Orders</b>
            <p class="text-muted fs-7">3 Orders sorted by delivery time</p>
        </div>
        <div class="col-4 p-0">
            <div class="d-flex justify-content-end mt-2">
                <span class="badge badge-green">Last 7 Days</span>
            </div>
        </div>
    </div>

    <div class="input-group my-2 border rounded">
        <span class="input-group-text bg-white border-0">
            <i class="bi bi-search"></i>
        </span>
        <input type="text" class="form-control border-0" placeholder="Search orders by number, customer & ..." />
    </div>


    <div class="pt-3">
        <div *ngFor="let order of orders" class="order-card px-3 py-4 mb-3 border rounded bg-white">
            <div class="row">
                <div class="col-2 p-0">
                    <span class="badge-green rounded-3 d-flex justify-content-center \" style="padding: 0.7rem;">
                        <img src="assets/icons/parcel-active.png" width="24" height="24" />
                    </span>
                </div>
                <div class="col-10 p-0 ps-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="fs-8 text-muted"><i class="bi bi-person pe-1"></i>{{ order.customerName }}</div>
                        <span class="fs-8"> | </span>
                        <small class="fs-8 text-muted">
                            <i class="bi bi-clock pe-1"></i> {{ order.deliveryTime }}
                        </small>
                    </div>
                    <div class="fw-bold text-uppercase py-1">{{ order.orderId }}</div>
                    <div class="text-muted"><b>{{ order.items }}</b>/{{ order.totalItems }} Items</div>
                </div>
            </div>
            <button class="btn btn-success w-100 mt-2 rounded-2 d-flex align-items-center justify-content-center">
                <i class="bi bi-geo-alt-fill me-2"></i>
                <span class="fs-7">{{ order.address }}</span>
            </button>
        </div>
    </div>

</div>
