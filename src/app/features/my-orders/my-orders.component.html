<div class="mt-3">
    <div class="row align-content-between">
        <div class="col-8 p-0">
            <b class="fw-bold fs-3">All Orders</b>
            <p class="text-muted fs-7" *ngIf="orders.length">{{orders.length}} Orders sorted by delivery time</p>
        </div>
        <div class="col-4 p-0">
            <div class="d-flex justify-content-end mt-2">
                <span class="badge badge-green">{{!selectedDate ? 'Today' : ''}}</span>
            </div>
        </div>
    </div>

    <div class="input-group my-2 border rounded position-relative">
        <span class="input-group-text bg-white border-0 pe-0">
            <i class="bi bi-search"></i>
        </span>
        <input type="text" [(ngModel)]="searchText" (input)="onSearch()" class="form-control border-0"
            placeholder="Search orders by number, customer & ..." />
        <span *ngIf="searchText" class="input-group-text bg-white border-0 ps-0">
            <!-- <i class="bi bi-x" (click)="searchText = ''"></i> -->
        </span>
        <!-- <div *ngIf="searchText" class="list-group position-absolute w-100 shadow bg-white mt-5 rounded"
            style="max-height: 250px; overflow-y: auto; z-index: 30">
            <ng-container *ngIf="searchResults.length > 0; else noData">
                <button type="button" class="list-group-item list-group-item-action" *ngFor="let order of searchResults"
                    [routerLink]="['/my-orders/order-detail', order?.orderId]">
                    <div class="fw-bold text-black">{{ order?.trasactionId }}</div>
                    <small class="text-muted">{{ order?.customerName }} • {{ order?.address }}</small>
                </button>
            </ng-container>
            <ng-template #noData>
                <div class="list-group-item text-muted text-center py-2">
                    No items found <span *ngIf="searchText">matching “{{searchText}}” </span>
                </div>
            </ng-template>
        </div> -->
    </div>

    <div class="mb-2 d-flex justify-content-end">
        <button class="btn btn-success btn-sm" [routerLink]="['/my-orders/grouped-orders']">Grouped Orders <i class="bi bi-arrow-right"></i></button>
    </div>

    <div class="d-flex justify-content-end align-items-center gap-1 flex-wrap">
        <input type="date" lang="en-US" style="width: 160px;" class="form-control form-control-sm" (input)="onDateChange($event)" [value]="selectedDate" />
        <button class="btn btn-outline-secondary btn-sm d-flex align-items-center"
            (click)="openDriverModal(driverFilterModal)">
            {{selectedDriverName || 'Drivers'}} <i class="bi bi-funnel"></i>
        </button>
    </div>

    <div class="pt-3">
        <div *ngIf="orders && orders.length > 0; else noOrders">
            <div *ngFor="let order of orders"
                class="order-card px-3 py-4 mb-3 border rounded bg-white position-relative">
                <span class="orderid-case">{{order?.orderId}}</span>
                <div class="row" [routerLink]="['/my-orders/order-detail', order?.orderId]">
                    <div class="col-2 p-0">
                        <span class="badge-green rounded-3 d-flex justify-content-center \" style="padding: 0.7rem;">
                            <img src="assets/icons/parcel-active.png" width="24" height="24" />
                        </span>
                    </div>
                    <div class="col-10 p-0 ps-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="fs-8 text-muted"><i class="bi bi-person pe-1"></i>{{ order?.customerName }}
                            </div>
                            <span class="fs-8"> | </span>
                            <small class="fs-8 text-muted">
                                <i class="bi bi-clock pe-1"></i> {{ order?.deliveryTimeInterval }}
                            </small>
                        </div>
                        <div class="fw-bold text-uppercase py-1">{{ order?.trasactionId }}</div>
                        <div class="text-muted"><b>{{ order?.confirmCount }}</b>/{{ order?.pendingCount }} Items</div>
                    </div>
                </div>
                <!-- radio checks -->
                <div class="d-flex gap-3 align-items-center pt-2">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="warehouseOpt{{ order?.orderId }}"
                            id="warehouse{{ order?.orderId }}" [checked]="order?.driverWarehouse"
                            (change)="setDriverWarehouse(order?.orderId)" />
                        <label class="form-check-label" for="warehouse{{ order?.orderId }}">Warehouse</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="jetroOpt{{ order?.orderId }}"
                            id="jetro{{ order?.orderId }}" [checked]="order?.driverJetro" (change)="setDriverJetro(order?.orderId)" />
                        <label class="form-check-label" for="jetro{{ order?.orderId }}">Jetro</label>
                    </div>
                </div>
                <button [routerLink]="['/my-orders/order-detail', order?.orderId]" class="btn btn-success w-100 mt-2 rounded-2 d-flex align-items-center justify-content-center">
                    <i class="bi bi-geo-alt-fill me-2"></i>
                    <span class="fs-7">{{ order.address }}</span>
                </button>
            </div>
        </div>
        <ng-template #noOrders>
            <div class="text-center text-muted py-5">
                No Orders
            </div>
        </ng-template>
    </div>

</div>

<!-- Driver Filter Modal -->
<ng-template #driverFilterModal>
    <div class="modal-body p-3 position-relative">
        <i class="bi bi-x position-absolute" style="top: 6px; right: 6px" aria-label="Close"
            (click)="modalRef?.hide()"></i>
        <p class="modal-title fs-5 mb-3 fw-semibold">Filter by Driver</p>
        <div class="d-flex flex-column gap-2">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="driverFilter" value="" [(ngModel)]="selectedDriver"
                    id="driver_all" />
                <label class="form-check-label" for="driver_all">All</label>
            </div>
            <div class="form-check" *ngFor="let driver of drivers">
                <input class="form-check-input" type="radio" name="driverFilter" [value]="driver?.driverId"
                    [(ngModel)]="selectedDriver" id="driver_{{driver?.driverId}}" />
                <label class="form-check-label" for="driver_{{driver?.driverId}}">
                    {{driver?.driverName}}
                </label>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-3">
            <button class="btn btn-outline-secondary btn-sm" (click)="modalRef?.hide()">Cancel</button>
            <button class="btn btn-success btn-sm" (click)="applyDriverFilter()">Apply</button>
        </div>
    </div>
</ng-template>
