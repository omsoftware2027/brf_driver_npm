<div class="d-flex justify-content-center align-items-center pt-3">
    <div class="card border rounded-4 p-4 shadow-sm" style="max-width: 380px; width: 100%;">
        <div class="text-center">
            <img src="assets/images/brand-logo.png" alt="B&R Food Services" style="max-width: 150px;">
        </div>

        <div *ngIf="step=== 'login'">
            <h4 class="text-center fw-bold pt-4">BRFood Driver Login</h4>
            <p class="text-center text-muted small mb-4">Enter your email and password</p>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="mb-1">
                    <div class="position-relative w-100">
                        <span class="position-absolute" style="top: 7px; left: 10px">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" formControlName="email" class="form-control" style="padding-left: 2rem;"
                            placeholder="Enter email">
                    </div>
                    <div class="text-danger small">
                        <div class="fs-8"
                            [ngStyle]="{'visibility': (email?.touched &&(email?.errors?.['email'] || email?.errors?.['required'])) ? 'visible' : 'hidden'}">
                            Enter a valid email</div>
                    </div>
                </div>
                <div class="mb-1">
                    <div class="position-relative w-100">
                        <span class="position-absolute" style="top: 7px; left: 10px">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" formControlName="password" class="form-control"
                            style="padding-left: 2rem;" placeholder="Enter your password">
                    </div>
                    <div class="text-danger small"
                        [ngStyle]="{ 'visibility': (password?.touched && (password?.errors?.['required'] || password?.errors?.['minlength'] )) ? 'visible' : 'hidden' }">
                        <div *ngIf="password?.errors?.['required']" class="fs-8"> Password is required </div>
                        <div *ngIf="password?.errors?.['minlength']" class="fs-8"> Password must be at least characters
                        </div>
                    </div>
                </div>
                <div class="d-grid" [ngClass]="{'pt-3': !password?.errors}">
                    <button class="btn btn-success rounded-3" type="submit" [disabled]="isLoading || loginForm.invalid">
                        <span *ngIf="!isLoading">Sign In</span>
                        <span *ngIf="isLoading" class="d-flex align-items-center justify-content-center">
                            <span class="spinner-border spinner-border-sm me-2"></span>
                            Authenticating...
                        </span>
                    </button>
                </div>

            </form>
        </div>

        <div *ngIf="step === 'otp'" class="text-center">
            <h4 class="fw-bold pt-4">Email Verification</h4>
            <p class="text-muted small mb-4">
                Enter the 4-digit code sent to {{userEmail}}
            </p>
        
            <div class="d-flex justify-content-center gap-2 mb-4">
                <input *ngFor="let digit of otpArray; let i = index" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="form-control text-center"
                    style="width: 45px; font-size: 20px;" [(ngModel)]="otpValues[i]" (input)="onOtpInput($event, i)"
                    (keydown)="onOtpKeyDown($event, i)" autocomplete="one-time-code" #otpInput />
            </div>
            <p class="text-muted small mb-3">
                OTP will expire in <b>1 min</b>
            </p>
        
            <button class="btn btn-primary w-100" (click)="onVerifyOtp()">Verify & Sign In</button>
            <button class="btn btn-outline-danger w-100 mt-3" (click)="onBackToLogin()">Back to Login</button>
        </div>
    </div>
</div>
