image: node:20.11.1

pipelines:
  default:
    - step:
        name: Build
        size: 2x
        caches:
          - node
        script:
          # Check project files
          - echo "$(ls -la)"

          # Install dependencies
          - npm install

          # Install Angular CLI (v16.x)
          - npm install -g @angular/cli@~16.2.0
          - ng config -g cli.warnings.versionMismatch false

          # Build Angular project in production mode
          - ng build --configuration production

          # Verify dist folder
          - echo "$(ls -la dist/)"

          # Copy build files to your server via SCP (default SSH port 22)
          - scp -r dist/driver-brfood/* brfserver@72.167.45.111:/var/www/driver-brfood/

